name: API Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/test-api.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/test-api.yml'

jobs:
  api-tests:
    # ドラフト PR では skip (push / schedule では走る)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: factrail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/factrail_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/factrail_test
      REDIS_URL: redis://localhost:6379
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Create database schemas
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d factrail_test -c "CREATE SCHEMA IF NOT EXISTS factrail;"

      - name: Push database schema
        run: pnpm exec prisma db push --accept-data-loss

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Run tests with coverage
        run: pnpm run test:cov

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: apps/api/coverage/
          retention-days: 30

      - name: Generate coverage summary
        id: coverage
        run: |
          COVERAGE_JSON=$(cat coverage/coverage-summary.json)
          STATEMENTS=$(echo $COVERAGE_JSON | jq -r '.total.statements.pct')
          BRANCHES=$(echo $COVERAGE_JSON | jq -r '.total.branches.pct')
          FUNCTIONS=$(echo $COVERAGE_JSON | jq -r '.total.functions.pct')
          LINES=$(echo $COVERAGE_JSON | jq -r '.total.lines.pct')
          echo "statements=$STATEMENTS" >> $GITHUB_OUTPUT
          echo "branches=$BRANCHES" >> $GITHUB_OUTPUT
          echo "functions=$FUNCTIONS" >> $GITHUB_OUTPUT
          echo "lines=$LINES" >> $GITHUB_OUTPUT

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const statements = '${{ steps.coverage.outputs.statements }}';
            const branches = '${{ steps.coverage.outputs.branches }}';
            const functions = '${{ steps.coverage.outputs.functions }}';
            const lines = '${{ steps.coverage.outputs.lines }}';

            const threshold = 80;
            const meetsThreshold = parseFloat(lines) >= threshold;
            const statusIcon = meetsThreshold ? '✅' : '⚠️';
            const statusText = meetsThreshold
              ? `Coverage meets ${threshold}% threshold`
              : `Coverage is below ${threshold}% threshold`;

            const comment = `## 📊 Test Coverage Report

            | Metric | Coverage |
            |--------|----------|
            | Statements | ${statements}% |
            | Branches | ${branches}% |
            | Functions | ${functions}% |
            | Lines | ${lines}% |

            ${statusIcon} ${statusText}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Check coverage threshold
        run: |
          LINES=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          THRESHOLD=80
          if (( $(echo "$LINES < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage ($LINES%) is below ${THRESHOLD}% threshold"
            exit 1
          fi
          echo "✅ Coverage ($LINES%) meets ${THRESHOLD}% threshold"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: apps/api/test-results/
          retention-days: 7
