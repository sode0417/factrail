name: Auto Fix (Manual Trigger)

on:
  # PRコメントでの手動トリガー（@claude fix）
  issue_comment:
    types: [created]

  # PRレビューコメント
  pull_request_review_comment:
    types: [created]

jobs:
  auto-fix-on-comment:
    # @claude fix コメントで実行
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      github.event.issue.pull_request &&
      (contains(github.event.comment.body, '@claude fix') || contains(github.event.comment.body, '@claude auto-fix'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            return {
              number: pr.data.number,
              ref: pr.data.head.ref,
              sha: pr.data.head.sha
            };

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJson(steps.pr.outputs.result).ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Claude Code to apply fixes
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            User requested auto-fix with comment:
            "${{ github.event.comment.body }}"

            Please:
            1. Analyze the PR and related CI results
            2. Fix any linting, formatting, or test issues
            3. Address the specific request in the comment
            4. Commit changes with descriptive messages
          additional_permissions: |
            actions: read

      - name: React to comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

  auto-lint-format:
    # PR作成時に自動フォーマット・Lint修正
    # このジョブはオプショナル（必要に応じて有効化）
    if: false  # 有効化する場合は true に変更
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Auto-fix lint issues (API)
        working-directory: apps/api
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint -- --fix || true
        continue-on-error: true

      - name: Auto-fix lint issues (Web)
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint -- --fix || true
        continue-on-error: true

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "chore: auto-fix lint issues"
          git push
