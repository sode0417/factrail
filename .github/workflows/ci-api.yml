name: API CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/ci-api.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/ci-api.yml'

jobs:
  api-ci:
    # ドラフト PR では skip (push / schedule では走る)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        # Dependabot の PR は「main へマージした結果」で package.json の pnpm.overrides と
        # lockfile の overrides が食い違い、--frozen-lockfile が
        # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH で落ちる。
        # そのため Dependabot の PR に限り、この実行の中だけで lockfile を解決し直す。
        # ⚠️ commit はしないので PR の lockfile 自体は直らない。食い違いがあった場合は
        #    警告を出す（緑になったことを「マージして安全」と読ませないため）。
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          RUN_ACTOR: ${{ github.actor }}
        run: |
          if [ "$PR_AUTHOR" = 'dependabot[bot]' ] || [ "$RUN_ACTOR" = 'dependabot[bot]' ]; then
            cp "$GITHUB_WORKSPACE/pnpm-lock.yaml" "$RUNNER_TEMP/pnpm-lock.before.yaml"
            pnpm install --no-frozen-lockfile
            if ! cmp -s "$GITHUB_WORKSPACE/pnpm-lock.yaml" "$RUNNER_TEMP/pnpm-lock.before.yaml"; then
              echo "::warning::この PR の pnpm-lock.yaml は package.json の pnpm.overrides と食い違っています。CI はこの実行の中で解決し直して通していますが、PR の lockfile 自体は直っていません。マージ前に @dependabot rebase を実行してください。"
            fi
          else
            pnpm install --frozen-lockfile
          fi

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: Run ESLint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
