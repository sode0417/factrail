name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write # Required: claude-code-action が内部で OIDC → GitHub App token 交換に使用
      actions: read # Required for reading CI results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for better context

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR TITLE: ${{ github.event.pull_request.title }}
            PR DRAFT: ${{ github.event.pull_request.draft }}

            ## レビューモードの判定

            PR TITLE が "[Phase 1]" で始まる、または PR DRAFT が true の場合は **設計レビューモード** で評価してください。それ以外は **実装レビューモード** で評価してください。

            ---

            ### 設計レビューモード (Phase 1: docs/issues/<NNN>-<slug>/ のみ変更)

            実装ファイル (apps/api, apps/web, .github/workflows 等) はまだ変更されていない前提です。コード品質・セキュリティ・パフォーマンスのレビューは行わず、以下の **設計観点のみ** で日本語でフィードバックしてください:

            1. **要件展開の正確性**: README.md は Issue の意図と乖離していないか / スコープが過大・過小ではないか
            2. **シーケンスの妥当性**: sequence.md の Mermaid 図が論理的に通っているか / フォールバック分岐が必要な場面でカバーされているか
            3. **テスト計画の網羅性**: test-plan.md が受入条件と整合しているか / 自動 vs 手動の分類が適切か / エビデンス取得方法が現実的か
            4. **影響範囲の正確性**: README.md の影響範囲表に漏れがないか / スコープ外の宣言が妥当か
            5. **規約整合性**: コミットメッセージ・PR タイトル・マージ方式が docs/issues/README.md の規約に従っているか

            ### 実装レビューモード (Phase 2 以降: 実装ファイルの変更を含む)

            通常の PR レビューとして、以下の観点で日本語でフィードバックしてください:

            1. コード品質（可読性・保守性・エラーハンドリング）
            2. セキュリティ（入力検証・認証認可・機密情報の取扱い）
            3. テストカバレッジ
            4. パフォーマンス影響
            5. 改善提案

            重点:
            - API 変更 (apps/api)
            - Web 変更 (apps/web)
            - DB スキーマ変更
            - CI/CD 変更

            ---

            ## 共通

            重大な指摘は "🔴 CRITICAL" を付けてください。
            自動修正可能な指摘は "@claude fix" コマンドの利用を提案してください。

            ## 注意: コメント本文での @claude メンション

            返信コメントを書く際、ユーザーや AI へ向けて Bot を参照する場合は **`@claude` を生で書かない**でください (claude.yml の二重 trigger になります)。代わりに `` `claude-review` ``、`claude[bot]`、"Bot レビュー" 等を使ってください。例外: ユーザーに `@claude fix` の利用を提案する箇所のみ生で書いて OK。

          # PR レビュー用の最小限ツール許可（公式 pr-review-comprehensive サンプル準拠）
          claude_args: |-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Read,Grep,Glob"

          additional_permissions: |
            actions: read

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

