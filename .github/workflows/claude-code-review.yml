name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write # Required: claude-code-action が内部で OIDC → GitHub App token 交換に使用
      actions: read # Required for reading CI results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better context

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このPRをレビューし、以下の観点で日本語でフィードバックしてください:

            1. コード品質（可読性・保守性・エラーハンドリング）
            2. セキュリティ（入力検証・認証認可・機密情報の取扱い）
            3. テストカバレッジ
            4. パフォーマンス影響
            5. 改善提案

            重点:
            - API 変更 (apps/api)
            - Web 変更 (apps/web)
            - DB スキーマ変更
            - CI/CD 変更

            重大な指摘は "🔴 CRITICAL" を付けてください。
            自動修正可能な指摘は "@claude fix" コマンドの利用を提案してください。

          # PR レビュー用の最小限ツール許可（公式 pr-review-comprehensive サンプル準拠）
          claude_args: |-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Read,Grep,Glob"

          additional_permissions: |
            actions: read

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

