packages:
  - 'apps/*'

# 依存の乗っ取り（出たばかりの版に悪いコードを混ぜる攻撃。2025年の Shai-Hulud など）への守り。
# https://pnpm.io/supply-chain-security
#
# 公開から 1 日（1440 分）たっていない版は入れない。手で足した依存や、下にぶら下がる依存
# （推移的な依存）にも効く。Dependabot の cooldown は PR を出す時期を遅らせるだけなので、
# これとは別に要る。
# どうしても急ぐ版（出たばかりのセキュリティ修正など）は minimumReleaseAgeExclude に
# 名前（"name" か "name@version"）を足して通し、入れたら外す。
# ⚠️ Dependabot のセキュリティの PR は cooldown を待たないので、直った版が 1 日未満だと
#    依存を解決し直すところがすべて落ちる: dependabot-lockfile.yml の作り直しと、
#    Dependabot の PR だけ --no-frozen-lockfile で入れる CI（ci-api・ci-web・test-api・
#    test-web・security）。そのときは上の除外を使うか、1 日待って CI を流し直す。
# ⚠️ --frozen-lockfile（scripts/deploy.sh・auto-fix.yml・Dependabot 以外の PR の CI）は
#    解決し直さないので、ここでは落ちない。その代わり lockfile にすでに入った版は調べ直さない。
# ⚠️ pnpm 10.16 より古いと、この設定は黙って無視される。
minimumReleaseAge: 1440
